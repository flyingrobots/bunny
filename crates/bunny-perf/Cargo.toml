[package]
name = "bunny-perf"
description = "Before/after timing harness for Bunny's deterministic math and query kernels."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bunny-perf"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["num", "linalg", "query", "angle", "scene", "trace", "pixel"]
# Each group compiles only against the APIs it times, so `cargo xtask perf --base <rev>` can
# build the same harness against an older Bunny that lacks a newer group.
num = []
linalg = []
query = []
angle = []
# A whole scene through the BVH: `scene` uses the visitor traversal that exists at v0.6.0,
# `trace` uses `closest_hit` and the trace kernels.
scene = []
trace = []
# Pixel values from `bunny-optics`: resolve, tone curve and RGBA8 output.
pixel = []

[dependencies]
bunny-broadphase = { path = "../bunny-broadphase", version = "0.6.0" }
bunny-geom = { path = "../bunny-geom", version = "0.6.0" }
bunny-linalg = { path = "../bunny-linalg", version = "0.6.0" }
bunny-num = { path = "../bunny-num", version = "0.6.0" }
bunny-optics = { path = "../bunny-optics", version = "0.6.0" }
bunny-query = { path = "../bunny-query", version = "0.6.0" }
