[package]
name = "bunny-perf"
description = "Before/after timing harness for Bunny's deterministic math and query kernels."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bunny-perf"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["num", "linalg", "query", "angle", "scene", "trace", "prepared", "sample", "pixel", "trace_compact", "trace_counted", "build", "sah", "shade", "normals", "smooth", "texture", "convert", "sweep"]
# Each group compiles only against the APIs it times, so `cargo xtask perf --base <rev>` can
# build the same harness against an older Bunny that lacks a newer group.
num = []
linalg = []
query = []
prepared = []
angle = []
# A whole scene through the BVH: `scene` uses the visitor traversal that exists at v0.6.0,
# `trace` uses `closest_hit` and the trace kernels.
scene = []
trace = []
# The sample hash and pixel sampler of `bunny-optics`.
sample = []
# Pixel values from `bunny-optics`: resolve, tone curve and RGBA8 output.
pixel = []
# The compact node layout (`compact_bvh` and its traversals), timed against `trace`.
trace_compact = []
# The counted compact traversals (`compact_closest_hit_counted`, `compact_any_hit_counted`).
trace_counted = []
# `build` times `build_bvh` on the scene; `sah` times `build_bvh_sah` and traces the same rays
# through its tree.
build = []
sah = []
# The diffuse shading steps of `bunny-optics` (`bunny-diffuse-shading/1`).
shade = []
# The area-weighted vertex normals of `bunny-optics` (`bunny-vertex-normals/1`).
normals = []
# Smooth shading per hit (`bunny-smooth-normal/1`, `bunny-smooth-shading/1`) on the scene's hits.
smooth = ["trace", "shade"]
# Texture coordinates and bilinear lookups (`bunny-texture-bilinear/1`) on seeded hits.
texture = []
# Q32.32 conversions at the f32 boundary (`try_from_f32`, `to_f32`).
convert = []
# `sweep_and_prune` of `bunny-broadphase` on a seeded scene of boxes.
sweep = []
# Mesh quantization and the mesh hash (`bunny-mesh`), and decoding from each `bunny-codec`
# format, on a seeded height-field grid. Not in `default`, so the default build of this
# harness does not pull in either crate (or `sha2`); `cargo xtask perf` and
# `code-dojo-perf-groups` build every group the manifest declares, so both still run there.
mesh = ["dep:bunny-mesh"]
codec = ["dep:bunny-codec", "dep:bunny-mesh"]

[dependencies]
bunny-broadphase = { path = "../bunny-broadphase", version = "0.7.1" }
bunny-codec = { path = "../bunny-codec", version = "0.7.1", optional = true }
bunny-geom = { path = "../bunny-geom", version = "0.7.1" }
bunny-linalg = { path = "../bunny-linalg", version = "0.7.1" }
bunny-mesh = { path = "../bunny-mesh", version = "0.7.1", optional = true }
bunny-num = { path = "../bunny-num", version = "0.7.1" }
bunny-optics = { path = "../bunny-optics", version = "0.7.1" }
bunny-query = { path = "../bunny-query", version = "0.7.1" }
