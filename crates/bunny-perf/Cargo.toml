[package]
name = "bunny-perf"
description = "Before/after timing harness for Bunny's deterministic math and query kernels."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bunny-perf"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["num", "linalg", "query", "angle", "scene", "trace", "prepared", "sample", "pixel", "trace_compact", "build", "sah", "shade", "normals"]
# Each group compiles only against the APIs it times, so `cargo xtask perf --base <rev>` can
# build the same harness against an older Bunny that lacks a newer group.
num = []
linalg = []
query = []
prepared = []
angle = []
# A whole scene through the BVH: `scene` uses the visitor traversal that exists at v0.6.0,
# `trace` uses `closest_hit` and the trace kernels.
scene = []
trace = []
# The sample hash and pixel sampler of `bunny-optics`.
sample = []
# Pixel values from `bunny-optics`: resolve, tone curve and RGBA8 output.
pixel = []
# The compact node layout (`compact_bvh` and its traversals), timed against `trace`.
trace_compact = []
# `build` times `build_bvh` on the scene; `sah` times `build_bvh_sah` and traces the same rays
# through its tree.
build = []
sah = []
# The diffuse shading steps of `bunny-optics` (`bunny-diffuse-shading/1`).
shade = []
# The area-weighted vertex normals of `bunny-optics` (`bunny-vertex-normals/1`).
normals = []

[dependencies]
bunny-broadphase = { path = "../bunny-broadphase", version = "0.7.1" }
bunny-geom = { path = "../bunny-geom", version = "0.7.1" }
bunny-linalg = { path = "../bunny-linalg", version = "0.7.1" }
bunny-num = { path = "../bunny-num", version = "0.7.1" }
bunny-optics = { path = "../bunny-optics", version = "0.7.1" }
bunny-query = { path = "../bunny-query", version = "0.7.1" }
